[project]
name = "nba-bets"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nba_api>=1.9.0",
    "pandas>=2.3.1",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "datasets>=4.4.1",
    "huggingface-hub>=0.34.0,<1.0",
    "transformers>=4.43.0",
    "torch>=2.9.1",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "mlflow>=2.8.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "py-clob-client>=0.34.5",
    "openai-agents>=0.10.2",
    "shap>=0.50.0",
    "python-dotenv>=1.0.0",
    "plotly>=5.20.0",
    "tqdm>=4.66.0",
]

# GPU-only fine-tuning stack. Kept out of the core dependencies because
# bitsandbytes has no macOS wheel and would break `uv sync` on a laptop.
# On the training box: uv sync --extra gpu
[project.optional-dependencies]
gpu = [
    "peft>=0.14",
    "trl>=0.13",
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
    "wandb>=0.19",
    "sentencepiece>=0.2",
]

[dependency-groups]
dev = [
    "findspark>=2.0.1",
    "jupyter>=1.1.1",
    "ruff>=0.14",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["mlruns", "outputs", "data", "old", "sandbox", "notebooks"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes — undefined names, unused imports
    "I",        # isort — import sorting
    "B",        # bugbear — mutable defaults, loop-variable capture
    "SIM",      # simplify
    "UP",       # pyupgrade — modernize to 3.11 syntax
    "C4",       # comprehensions
    "RET",      # return-flow issues
    "ARG",      # unused arguments
    "PTH",      # prefer pathlib over os.path
    "PD",       # pandas-vet — inplace=True, chained assignment
    "NPY",      # numpy — legacy np.random.seed, deprecated aliases
    "RUF",      # ruff-specific
    "S",        # bandit — security (pickle, subprocess, hardcoded secrets)
    "DTZ",      # naive datetimes
    "T20",      # stray print() — this project has a logger
    "ERA",      # commented-out code
    "TID",      # tidy imports
    "G",        # logging format — f-strings in logger calls
    "PL",       # pylint subset
    "TRY",      # exception antipatterns
]
ignore = [
    "E501",    # line length — the formatter owns this
    "PD011",   # .values false-fires on non-pandas objects
    "PLR0913", # many args is normal for model/training functions
    "PLR0917", # ditto, positional variant
    "PLR2004", # magic numbers — too noisy in feature engineering
    "RET504",  # named return variable aids readability
    "TRY003",  # long messages inside raise are fine
    "G004",    # f-string in logging — 167 hits, style-only, drowns real signal
    "PLC0415", # import outside top-level — deliberate for lazy torch/GPU imports
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG", "PLR2004"]           # assert, fixtures, literals
"**/*.ipynb" = ["T20", "E402", "ERA001", "F401"]  # notebooks are exploratory
"src/eda/**" = ["T20", "ERA001"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
