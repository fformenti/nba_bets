[project]
name = "nba-bets"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nba_api>=1.9.0",
    "pandas>=2.3.1",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "datasets>=4.4.1",
    "huggingface-hub>=0.34.0,<1.0",
    "transformers>=4.43.0",
    "torch>=2.9.1",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "mlflow>=2.8.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "py-clob-client>=0.34.5",
    "openai-agents>=0.10.2",
    "shap>=0.50.0",
    "python-dotenv>=1.0.0",
    "plotly>=5.20.0",
    "tqdm>=4.66.0",
]

# GPU-only fine-tuning stack. Kept out of the core dependencies because
# bitsandbytes has no macOS wheel and would break `uv sync` on a laptop.
# On the training box: uv sync --extra gpu
[project.optional-dependencies]
gpu = [
    "peft>=0.14",
    "trl>=0.13",
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
    "wandb>=0.19",
    "sentencepiece>=0.2",
]

[dependency-groups]
dev = [
    "findspark>=2.0.1",
    "jupyter>=1.1.1",
]
