# Example configuration file for classification training
# Copy this file and modify as needed for your experiments

data:
  path: "data/processed/games_features.csv"
  target_column: "win_bool"
  date_column: "gameDate"
  drop_na: true

splitting:
  method: "temporal"  # 'random', 'temporal', or 'stratified'
  test_size: 0.2
  val_size: 0.2
  random_state: 42

feature_engineering:
  create_delta_features: true
  create_location_features: true
  create_conference_features: true
  create_rest_features: true
  drop_original_features: true

  # Columns to exclude from features
  # CRITICAL: pts_diff, homeScore, awayScore, and win_bool are excluded to prevent data leakage
  # pts_diff = homeScore - awayScore is a direct proxy for win_bool
  # homeScore and awayScore directly determine pts_diff
  exclude_columns:
    - "gameId"
    - "winner"
    - "hometeamPrename"
    - "hometeamId"
    - "homeScore"  # CRITICAL: Exclude to prevent data leakage (directly determines pts_diff)
    - "awayteamName"
    - "awayteamId"
    - "awayScore"  # CRITICAL: Exclude to prevent data leakage (directly determines pts_diff)
    - "hometeamConference"
    - "awayteamConference"
    - "winnerteamConference"
    - "gameType"
    - "gameDateOnlyStr"
    - "season"
    - "pts_diff"  # CRITICAL: Exclude to prevent data leakage (direct proxy for win_bool)
    - "win_bool"  # CRITICAL: Target variable, must be excluded from features
    - "total_wins_HT"
    - "total_losses_HT"
    - "total_wins_VT"
    - "total_losses_VT"
    - "total_wins_HT_at_home"
    - "total_losses_HT_at_home"
    - "total_wins_VT_on_road"
    - "total_losses_VT_on_road"
    - "games_played_HT_at_home"
    - "games_played_VT_on_road"
    - "games_played_HT"
    - "games_played_VT"

preprocessing:
  scaling_method: "standard"  # 'standard', 'robust', or 'minmax'
  imputation_strategy: "mean"
  handle_outliers: true

model:
  type: "classification"
  name: "random_forest"
  hyperparameter_tuning:
    enabled: false
    method: "random"  # 'grid' or 'random'
    n_iter: 20
    cv_folds: 3
    scoring: "f1"

  # Model-specific parameters
  random_forest:
    n_estimators: 100
    max_depth: null
    min_samples_split: 20
    min_samples_leaf: 10
    max_features: "sqrt"
    class_weight: "balanced"

  gradient_boosting:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 5
    min_samples_split: 20
    min_samples_leaf: 10

evaluation:
  save_visualizations: true
  output_dir: "outputs"

paths:
  model_registry: "models"
  outputs: "outputs"
