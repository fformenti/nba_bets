# Shared across every experiment type and base model under configs/train_llm/.
# Model-specific settings (base_model id, context_length) live in
# _base_models/<model>.yaml; experiment-type-specific settings (quantization
# recipe, LoRA block, training hyperparameters) live in
# <type>/_defaults.yaml. An experiment file _includes both layers on top of
# this one, in that order, then overrides anything unique to that run.

# null -> a timestamped name is generated at launch and printed in the log.
# Pin it (or pass --run-name) to resume an interrupted run.
run_name: null

hub:
  user: "fformenti"
  project_name: "nba-bets"
  private: true
  # Checkpoints are pushed to the Hub so a dropped connection is recoverable.
  push_checkpoints: true

data:
  dataset_name: "fformenti/nba-bets"
  train_split: "train"
  eval_split: "validation"
  # Evaluation only. Training deliberately names no text field — see
  # LLMDataConfig.prompt_field and build_sft_config().
  prompt_field: "prompt"
  # null = train on the full split. The train split is date-sorted and the cap
  # takes the first N rows, so a small value here means the oldest N games, not
  # a sample. Use --max-train-samples for smoke tests instead.
  max_train_samples: null
  # null = score the whole eval_split at every evaluation. A number takes a
  # seeded random sample of that many rows, for cheaper, more frequent evals.
  max_eval_samples: null

  # The LLM trains on exactly the games the sklearn models train on. Splits are
  # produced by src/ml/datasets/splits.py from the config below, then serialized
  # to text — same gameIds, same feature columns, only the encoding differs.
  # Point this at the same config you compare against.
  # LLM-specific feature set: same pipeline as the sklearn configs, but with
  # win percentage and streak enabled. Swap back to configs/train/xgboost.yaml
  # for a strict like-for-like comparison against the sklearn models.
  source_experiment_config: "configs/train/llm_features.yaml"

  # labeled | json | markdown | per_team.
  # The first three follow whatever feature columns the config produces, so new
  # features reach the prompt automatically; labeled additionally renders
  # human-readable names. per_team renders the fixed layout of
  # src/ml/llm/prompt_template_per_team.md, with features, team/delta and the
  # games-played thresholds chosen by prompt_config.
  serialization_format: "per_team"
  prompt_config: "configs/llm_prompt/per_team.yaml"

  # Era scaling of the target. The completion is margin * 13.0 / s, where s is
  # the league's season-to-date margin std at tip-off (~13 over 1996/97-2020/21,
  # ~15.7 in the test seasons). Evaluation multiplies s/13.0 back in, so MAE is
  # reported in real points. null = raw points.
  target_reference_std: 13.0

evaluation:
  split: "test"
  size: 200
  seed: 42

tracking:
  wandb:
    enabled: true
    project: "nba-bets"
    # Gradient histograms for 256 LoRA matrices every logging step, never read;
    # train/grad_norm already shows stability.
    watch: "false"
    # "checkpoint" would upload every checkpoint as a W&B artifact. The Hub
    # already keeps them.
    log_model: "false"
  mlflow:
    enabled: true
    experiment_name: "nba_bets_llm"
    # Local sqlite dies with an ephemeral GPU box - copy mlflow.db back after
    # a run, or point this at a remote tracking server.
    tracking_uri: "sqlite:///mlflow.db"

paths:
  output_dir: "outputs/llm"
