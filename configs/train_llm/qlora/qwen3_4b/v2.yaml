description: "QLoRA SFT of Qwen3-4B on nba-bets point-differential prompts (v2 settings)"

# Everything comes from ../_defaults.yaml; this file only sets what depends on
# the GPU (an L4 here). Checkpoints go to outputs/checkpoints/<run_name>/.

_include:
  - "../../_defaults.yaml"
  - "../_defaults.yaml"
  - "../../_base_models/qwen3_4b.yaml"

quantization:
  compute_dtype: "bfloat16"

training:
  bf16: true
  fp16: false
  tf32: true
  per_device_eval_batch_size: 16

evaluation:
  max_new_tokens: 5
  batch_size: 32
