description: "QLoRA SFT of Llama-3.2-1B on nba-bets point-differential prompts (v2 settings)"

# Everything comes from ../_defaults.yaml; this file only sets what depends on
# the GPU (an L4 here) and where outputs go.

_include:
  - "../../_defaults.yaml"
  - "../_defaults.yaml"
  - "../../_base_models/llama32_1b.yaml"

quantization:
  compute_dtype: "bfloat16"

training:
  bf16: true
  fp16: false
  tf32: true
  # No gradient checkpointing: ~25% faster on the 8B in E3. Activations scale
  # with layers x hidden size, a quarter of the 8B's (~0.7 GB per row), so the
  # default 8 x 4 should peak around 8 GB. Not measured yet - E4 will show it.
  gradient_checkpointing: false
  per_device_eval_batch_size: 16

evaluation:
  max_new_tokens: 5
  batch_size: 32

paths:
  output_dir: "outputs/llm/qlora/llama32_1b"
