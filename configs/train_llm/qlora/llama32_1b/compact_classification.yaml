description: "Llama-3.2-1B compact, won/lost completion (classification mode)"

# compact.yaml with one change: the prompt ends "Home team" instead of
# "Home margin =", and the model completes " won" / " lost" instead of the
# signed margin (src/ml/llm/target.py). Every line before the cue is
# byte-identical to compact's. It trains on its own Hub dataset, built from
# this file; the name must end in -classification (LLMDataConfig enforces it),
# so a push can never overwrite the regression dataset:
#   make build-llm-dataset LLM_CONFIG=qlora/llama32_1b/compact_classification ARGS=--push

_include:
  - "compact.yaml"

data:
  target_mode: "classification"
  dataset_name: "fformenti/nba-bets-compact-classification"
