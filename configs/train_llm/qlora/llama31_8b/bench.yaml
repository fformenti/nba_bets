description: "E3 speed benchmark: Llama-3.1-8B v2 (4-bit, gradient checkpointing, 8x4) for 50 steps"

# The reference point of the E3 speed benchmark. Each bench_*.yaml includes
# this file and changes one thing. Only throughput matters here
# (train_samples_per_second, peak_gpu_reserved_gb), so evaluation is off and
# no checkpoint is pushed; the final adapter still lands in the run's Hub repo.

_include:
  - "v2.yaml"

data:
  # 50 optimizer steps at an effective batch of 32. The oldest 1,600 games -
  # every variant trains on the same rows.
  max_train_samples: 1600

training:
  eval_strategy: "no"
  # The E3 reference setting, pinned so the benchmark still reproduces after
  # v2.yaml adopted its winner (no checkpointing, 2 x 16).
  gradient_checkpointing: true
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4

hub:
  push_checkpoints: false
