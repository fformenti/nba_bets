description: "QLoRA SFT of Llama-3.1-8B on nba-bets point-differential prompts (v2 settings)"

# Everything comes from ../_defaults.yaml; this file only sets what depends on
# the GPU (an L4 here) and where outputs go.

_include:
  - "../../_defaults.yaml"
  - "../_defaults.yaml"
  - "../../_base_models/llama31_8b.yaml"

quantization:
  compute_dtype: "bfloat16"

training:
  bf16: true
  fp16: false
  tf32: true
  # E3 (project_knowledge/llm_training/e3_speed_benchmark.md): without gradient
  # checkpointing a step drops from 18.4 to 13.8 s. 8 rows per micro-batch then
  # run out of memory; 2 x 16 peaks at 12.3 GB, leaving room for longer prompts.
  # 4 x 8 was 3% faster but peaked at 18.6 of the L4's 22 GB.
  gradient_checkpointing: false
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 16
  per_device_eval_batch_size: 16

evaluation:
  max_new_tokens: 5
  batch_size: 32

paths:
  output_dir: "outputs/llm/qlora/llama31_8b"
