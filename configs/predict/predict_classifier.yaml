paths:
  input_dir: "data/raw/incremental/upcoming_games"
  output: "data/predictions/upcoming_games_predictions.csv"
  features: "data/processed/regular_season/games_features.csv"

data:
  target_column: "win_bool"
  date_column: "gameDate"
  drop_na: true

# MLflow model URIs keyed by conference filter type.
# Use runs:/ URIs when register_model is false (artifact_path = nba_{model}_{conference}).
# Use models:/ URIs only when register_model is true in training config.
model_uris:
  same: "runs:/4f4b53f0de5c4716aa571a069dceebbe/nba_xgboost_same"
  different: "runs:/77edd1b51a4f43b394b43814e33e27fb/nba_xgboost_different"
  all: "runs:/a3d6a327ba564baeb37e4a4ea8eae5ed/nba_xgboost_all"

mlflow:
  experiment_name: "nba_bets_predictions"
  tracking_uri: "sqlite:///mlflow.db"
  register_model: false

allow_missing_features: true
