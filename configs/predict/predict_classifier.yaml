paths:
  input_dir: "data/raw/incremental/upcoming_games"
  output: "data/predictions/upcoming_games_predictions.csv"
  features: "data/processed/regular_season/games_features.csv"

data:
  target_column: "win_bool"
  date_column: "gameDate"
  drop_na: true

# The deployed model, written by `make train PROMOTE=1`.
# Always a runs:/ URI (artifact_path = nba_{model}). Training does not register
# models — the MLflow Model Registry is unused, so models:/ URIs never resolve.
#
# One model predicts every game. Routing games to same-conference and
# cross-conference models scored worse over eight backtested seasons — see
# docs/CONFERENCE_SPLIT.md.
model_uri: "runs:/ee34b43e038245b8a3879a86a4bf69b0/nba_xgboost"

mlflow:
  experiment_name: "nba_bets_predictions"
  tracking_uri: "sqlite:///mlflow.db"
  register_model: false

allow_missing_features: true
