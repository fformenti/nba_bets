# Feature engineering parameters — single source of truth for ETL lags.
# Used by: ETL (make_features), incremental ingestion, ML training (lags/alpha merge).
# Training configs include this file via _include, then configs/train/_defaults.yaml.
#
# This file answers exactly one question: which rolling windows does the ETL
# compute? Nothing here decides what a model consumes.
#
#   lags:          rolling windows to compute (ETL + ML)
#   location_lags: which lags also get home/road variants (ETL + ML)
#
# ── Which of these keys the ETL actually reads ───────────────────────────────
# "ETL + ML" above is the general case, not the universal one. Three groups
# below are exceptions, and knowing which is which is the difference between an
# edit that changes the build and one that changes nothing:
#
#   record.location_lags drives the home/road tables for ALL THREE of record,
#   margin and margin_scaled — aggregator.py passes one `location_lags`
#   argument (schema.py::location_lags reads `record` only) to
#   calculate_home_record and calculate_home_margin (once per margin
#   column) alike. So `margin.location_lags` and
#   `margin_scaled.location_lags` are read by nothing in the ETL.
#   They are NOT dead, though: the ML resolver reads each group's own key to
#   name the `_at_location_delta` columns. Keep all three lists equal or
#   training asks for columns the ETL never built. Pinned by
#   tests/test_config_loading.py::test_location_lags_agree_across_families.
#
#   sos has no `location_lags` because there is no at-home/on-road SOS builder;
#   the key would be read by nothing. `sos.lags` decides only which sos_L{lag}
#   columns get *persisted*. The extra windows sos_adj_record's location
#   variants need are unioned in automatically: aggregator.py computes SOS at
#   set(sos_lags) | set(sos_adj_record.location_lags), then saves only the
#   declared ones — which is why sos_L10/L20/L41 exist during the build and
#   never reach the CSV.
#
#   sos_adj_record has no `lags` because the ETL does not read that key. Its
#   plain sos_adj_record_L{lag}_HT/_VT columns are built from `record.lags`, so
#   all nine windows are emitted regardless. Only `sos_adj_record.location_lags`
#   is read here. On the ML side the same key IS read, and leaving it undeclared
#   (-> []) is exactly what ships only the at-location variants to a model. See
#   configs/train/_defaults.yaml.
#
# Two undeclared dependencies worth knowing before editing `sos.lags`:
# emptying it skips the whole block that also builds adjusted_last_season_record
# (aggregator.py `if sos_lags:`), and dropping 82 from it raises a KeyError in
# last_season_record.py::_season_sos, which hard-codes sos_L82.
#
# `enabled` and `delta` are ML-only and live in configs/train/_defaults.yaml.
# There used to be an `enabled` key on every group here, documented as "ML
# only; ETL always computes all". It was read by nothing: the ETL never looks
# at it (aggregator.py only unpacks .lags/.location_lags/.sos_adj_alpha/
# .gds_beta), and _defaults.yaml is merged afterwards and re-declares `enabled`
# for every group, so its value always won. Five of the thirteen keys asserted
# the opposite of what actually reached a model — this file said
# `record: enabled: true` while no sklearn model had seen record in months.
#
# Groups with no lags at all (rested_days, back_to_back, streak, home_and_road,
# neutral_court, games_behind_leader, games_behind_above, games_ahead_of_below,
# winning_incentive) have nothing to say to the ETL and are declared only in
# _defaults.yaml. streak (like rest_days) still gets an unconditional
# home/road split table (streak_HT_at_home/VT_on_road) — it just has no lag
# list to configure, so there is still nothing for this file to say about it.

feature_engineering:
  sos_adj_alpha: 1.0
  gds_beta: 0.10
  # Below this many current-season interconference games played, the
  # conference-matchup features ramp from last season's final record toward
  # this season's; at/above it they use this season's record outright.
  conference_record_saturation_games: 20

  features:
    record:
      lags: [1, 3, 5, 8, 13, 21, 34, 55, 82]
      location_lags: [5, 10, 20, 41]

    margin:
      lags: [1, 3, 5, 8, 13, 21, 34, 55, 82]
      location_lags: [5, 10, 20, 41]

    margin_scaled:
      lags: [1, 3, 5, 8, 13, 21, 34, 55, 82]
      location_lags: [5, 10, 20, 41]

    sos:
      lags: [1, 3, 5, 8, 13, 21, 34, 55, 82]

    sos_adj_record:
      location_lags: [5, 10, 20, 41]

    gds:
      lags: [3, 5, 8, 13, 21, 34, 55, 82]
      location_lags: [5, 10, 20, 41]

    distance:
      lags: [1, 3, 7, 14]

    last_season_record:
      location_lags: []         # no lags, but has HT_at_home/VT_on_road variants

    adjusted_last_season_record:
      location_lags: []         # no lags, but has HT_at_home/VT_on_road variants
