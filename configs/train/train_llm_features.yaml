# Feature set for the LLM fine-tune.
#
# Same pipeline and same splits as the sklearn configs — only the column
# selection differs. Two groups that train_all.yaml disables are turned on here
# because they are unusually legible to a language model pretrained on sports
# prose: win percentage and win/loss streak are stated in plain English in every
# NBA recap ever written, whereas `norm_pts_diff_avg_L8` is not.
#
# The tradeoff: the LLM now sees columns the sklearn models do not, so a run
# against this config is NOT a strict like-for-like comparison. Point
# data.source_experiment_config at configs/train/train_all.yaml for that.

_include:
  - "../features.yaml"
  - "_defaults.yaml"

description: "LLM feature set: all games, plus win percentage and streak"
tags:
  variation: "llm_features"

filters:
  conference_filter: "all"

feature_engineering:
  features:
    # Enabled here, disabled in train_all.yaml. Win percentage is the most
    # semantically loaded stat available and was otherwise absent entirely.
    record:
      lags: [3, 8, 21, 55]
      location_lags: [10, 41]
      delta: true
      enabled: true

    point_differential:
      lags: [1, 3, 5, 8, 13, 21, 34, 55, 82]
      location_lags: [5, 10, 20, 41]
      delta: true
      enabled: false
    norm_point_differential:
      lags: [1, 3, 5, 8, 13, 21, 34, 55]
      location_lags: [5, 10, 20, 41]
      delta: true
      enabled: true
    gds:
      lags: [3, 5, 8, 13, 21, 34, 55, 82]
      location_lags: [5, 10, 20, 41]
      delta: true
      enabled: false

    sos_adj_record:
      enabled: true
      lags: []
      location_lags: [5, 10, 20, 41]
      delta: true

    # Short-term form in the form a language model already has words for.
    streak:
      delta: true
      enabled: true

    rested_days:
      delta: true
      enabled: true

    back_to_back:
      delta: true
      enabled: true

    adjusted_last_season_record:
      location_lags: [] # no lags, but has HT_at_home/VT_on_road variants
      delta: true
      enabled: true

    indifference_flag:
      delta: true
      enabled: true

    # days_at_home / days_on_road. Left as raw per-team columns rather than
    # forced through a delta: "the home team has been home 10 days" is a
    # statement about that team, not a comparison between the two.
    home_and_road:
      delta: false
      enabled: true

feature_selection:
  include_tentative: true

paths:
  outputs: "outputs/llm_features"

mlflow:
  experiment_name: "nba_bets_llm_features"
