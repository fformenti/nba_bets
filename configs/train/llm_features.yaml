# Feature set for the LLM fine-tune.
#
# An ExperimentConfig, same schema as xgboost.yaml, which is why it lives here
# and not in configs/train_llm/ — that directory holds LLMTrainingConfig files
# (base model, LoRA, quantization), a different schema with a different loader.
# Nothing trains from this file directly: build_llm_dataset reads it for the
# column selection and the splits, then serializes those games to text.
#
# Same pipeline and same splits as the sklearn configs — only the column
# selection differs. What is turned on here is turned on for legibility to a
# language model pretrained on sports prose: a win/loss streak is stated in
# plain English in every NBA recap ever written, whereas `norm_pts_diff_avg_L8`
# is not.
#
# The tradeoff: the LLM sees columns the sklearn models do not, so a run against
# this config is NOT a strict like-for-like comparison. Point
# data.source_experiment_config at configs/train/xgboost.yaml for that.
#
# THE REDUNDANCY RULE APPLIES HERE TOO — more strictly, if anything. This config
# used to enable `record` on the legibility argument while inheriting
# sos_adj_record, which is computed from it (record * (sos/league_avg)^alpha,
# measured r = 0.95). On the sklearn path a redundant column at least meets
# Boruta-SHAP on the way in; here nothing filters anything. Nothing trains from
# this file — build_llm_dataset reads it for the column selection and the splits
# — so there is no feature-selection pass, and a duplicated column goes straight
# into the prompt, spending tokens to say a thing the next line already said.
# `record` is therefore disabled, inherited from _defaults.yaml. If you want win
# percentage in the prompt in preference to the adjusted version, disable
# sos_adj_record here rather than enabling both.
#
# Every block below is a genuine deviation from _defaults.yaml. Groups the
# sklearn path and this one agree on are inherited, not restated.

_include:
  - "../features.yaml"
  - "_defaults.yaml"

description: "LLM feature set: all games, plus win/loss streak and raw home/road days"
tags:
  variation: "llm_features"

feature_engineering:
  features:
    # Short-term form in the form a language model already has words for.
    streak:
      delta: true
      enabled: true

    # days_at_home / days_on_road. Left as the raw per-team pair rather than
    # collapsed into the sum _defaults.yaml uses: "the home team has been home
    # 10 days" is a statement about that team, and spelling both out reads as
    # prose where a summed integer does not.
    home_and_road:
      delta: false
      enabled: true

paths:
  outputs: "outputs/llm_features"

mlflow:
  experiment_name: "nba_bets_llm_features"
