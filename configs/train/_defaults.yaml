# Shared training defaults, plus the canonical ML feature set.
#
# Not runnable on its own: it does not _include features.yaml and declares no
# mlflow.experiment_name. Leaf configs in this directory include it and override
# only what differs — today that is `model.train_models` and nothing else for the
# sklearn path. Read directly by src/betting/game_slugs.py (for
# splitting.test_start_season) and by src/ml/training/experiment.py.
#
# Division of labour with ../features.yaml, which is included first:
#   features.yaml   lags / location_lags — which feature tables ETL builds
#   this file       delta / enabled — what a model consumes, plus ML-only lag
#                   overrides where the model wants fewer lags than ETL builds
# A lag list repeated here with the same value as features.yaml is noise; only
# genuine overrides belong below.

data:
  path: "data/processed/regular_season/games_features.csv"
  target_column: "win_bool"
  date_column: "gameDate"
  drop_na: true

filters:
  min_season: "1980/81"
  minimum_games_train: 15
  minimum_games_test: 5

weighting:
  # Within-season ramp only. There is deliberately no cross-season decay knob:
  # `make tune-decay` backtested eight seasons (2014/15–2021/22), one model per
  # fold, everything but lambda held fixed, and log loss rose monotonically with
  # it — the old 0.1 cost +0.0031 to +0.0055 against no decay, 2.4–3.1 standard
  # errors out, because halving the effective sample (44.7k rows → 22.7k) bought
  # less than the recency it paid for. [0, 0.05] was within noise, 0.2 and above
  # clearly worse. The knob, the sweep and its harness were removed once the
  # answer stopped changing.
  #
  # Note that the decay anchor was never the issue people took it for: it sat on
  # the newest *training* season, but exp(-l*(A-i)) = exp(-l*(M-i)) * exp(-l*(A-M)),
  # so moving it forward only rescales every weight by a constant. Relative
  # weighting across seasons is anchor-invariant. Staleness is a training-window
  # problem, handled under `splitting:` below.
  enabled: true
  saturation_K: 30

splitting:
  method: "temporal"
  # Split on season boundaries, not row proportions. A fraction of the rows
  # covers far more calendar time at the old end of the history than the recent
  # end, so test_size/val_size of 0.2 left the last training game in 2014 —
  # eleven years of the most relevant basketball never reached the model.
  # These two win over test_size/val_size; those remain only as the fallback.
  #
  # Keep this window rolling forward. The boundary is terminal, so every season
  # spent on validation or test is a season the deployed model never trains on —
  # at "2022/23"/2 the train ceiling was 2019/20 while prediction served 2025/26,
  # six seasons of basketball absent from training rather than down-weighted.
  # Roll both forward as seasons complete.
  #
  # val_seasons was 1 on the theory that ~1,230 games is enough. After the
  # minimum_games_train mask that is 982 rows, and every validation-based
  # decision is made on them. Measured head to head, 1 vs 2 seasons: no
  # meaningful difference in test Brier (0.2098 vs 0.2094) or accuracy (66.11%
  # vs 66.44%), both inside the noise of a 1,201-row test set. But the
  # calibration choice flipped between them on a ±0.0003 Brier margin. Two
  # seasons (1,965 rows) buys a steadier decision for 2.6% of the training rows.
  test_start_season: "2024/25"
  val_seasons: 2
  test_size: 0.2
  val_size: 0.2
  random_state: 42

feature_engineering:
  selection_mode: "inclusion"
  # Columns used by prepare_data() for metadata extraction (weighting, analysis).
  # In inclusion mode these do not affect feature selection — only declared features are kept.
  metadata_columns:
    - "gameId"
    - "winner"
    - "hometeamPrename"
    - "hometeamId"
    - "hometeamName"
    - "homeScore"
    - "awayteamName"
    - "awayteamPrename"
    - "awayteamId"
    - "awayScore"
    - "hometeamLocation"
    - "awayteamLocation"
    - "gameLocation"
    - "hometeamConference"
    - "awayteamConference"
    - "winnerteamConference"
    - "gameType"
    - "gameDateOnlyStr"
    - "season"
    - "overtimes"
    - "postponed"
    - "is_neutral_court_game"
    - "games_played_HT"
    - "games_played_VT"

  # Delta for every group lives here — including the disabled ones — so
  # create_delta_features and resolve_feature_columns stay consistent the moment
  # an experiment flips `enabled`.
  features:
    record:
      delta: true
      enabled: false
    point_differential:
      delta: true
      enabled: false
    norm_point_differential:
      # ETL builds L82 (see features.yaml); the model stops at L55. One genuine
      # override, not a copy of the ETL list.
      lags: [1, 3, 5, 8, 13, 21, 34, 55]
      delta: true
      enabled: true

    sos:
      delta: false
      enabled: false
    sos_adj_record:
      # location_lags only — the plain rolling variants lost to the at-location
      # ones. Declare `lags:` in a leaf config to bring them back.
      delta: true
      enabled: true
    gds:
      delta: true
      enabled: false
    distance:
      delta: true
      enabled: true
    rested_days:
      delta: true
      enabled: true
    back_to_back:
      # delta = back_to_back_HT - back_to_back_VT (negative = home team more fatigued)
      delta: true
      enabled: true
    streak:
      delta: true
      enabled: false
    last_season_record:
      delta: true
      enabled: false
    adjusted_last_season_record:
      delta: true
      enabled: true
    home_and_road:
      # delta here is a SUM, not a difference (engineering.py) — and a sum is the
      # right operation: days_at_home helps the home team, and days_on_road for
      # the visitor helps the home team too, so both push the same direction.
      # This collapses two columns into one to cut dimensionality. Which wins,
      # collapsed or raw, is still unmeasured — llm_features.yaml keeps them raw.
      delta: true
      enabled: true
    indifference_flag:
      delta: true
      enabled: true
    neutral_court:
      delta: false
      enabled: false

feature_selection:
  enabled: true
  method: "boruta_shap"
  n_iterations: 20
  significance_level: 0.05
  include_tentative: true
  random_state: 42

preprocessing:
  scaling_method: "standard"
  imputation_strategy: "mean"
  handle_outliers: false

model:
  type: "classification"
  name: "nba_games_classifier"
  train_models:
    - random_forest
    - gradient_boosting
    - xgboost
    - neural_network
    # - lgbm

  random_forest:
    n_estimators: 300
    max_depth: 10
    min_samples_split: 20
    min_samples_leaf: 15
    max_features: "sqrt"
    max_samples: 0.7
    class_weight: "balanced"
    hyperparameter_tuning:
      enabled: true
      method: "random"
      n_iter: 20
      cv_folds: 5
      scoring: "accuracy"
      param_grid:
        n_estimators: [100, 200, 300, 500]
        max_depth: [5, 7, 10]
        min_samples_split: [20, 30, 50]
        min_samples_leaf: [10, 15, 20, 30]
        max_features: ["sqrt", "log2", 0.5]
        max_samples: [0.6, 0.7, 0.8]

  gradient_boosting:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 5
    min_samples_split: 20
    min_samples_leaf: 10
    max_features: "sqrt"
    hyperparameter_tuning:
      enabled: true
      method: "random"
      n_iter: 20
      cv_folds: 5
      scoring: "accuracy"
      param_grid:
        n_estimators: [50, 100, 200, 300]
        learning_rate: [0.005, 0.01, 0.05]
        max_depth: [3, 4, 5, 6]
        min_samples_split: [10, 20, 30, 50]
        min_samples_leaf: [5, 10, 15, 20]
        subsample: [0.7, 0.8, 0.9]
        max_features: ["sqrt", "log2", 0.5]

  xgboost:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 5
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
    hyperparameter_tuning:
      enabled: true
      method: "random"
      n_iter: 20
      cv_folds: 5
      scoring: "accuracy"
      param_grid:
        n_estimators: [100, 200, 300, 500]
        learning_rate: [0.01, 0.05, 0.1]
        max_depth: [3, 4, 5, 6]
        subsample: [0.7, 0.8, 0.9]
        colsample_bytree: [0.6, 0.8, 1.0]
        reg_alpha: [0, 0.1, 0.5]
        reg_lambda: [0.5, 1.0, 2.0]

  lgbm:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 6
    num_leaves: 31
    min_child_samples: 20
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
    class_weight: "balanced"
    verbose: -1
    hyperparameter_tuning:
      enabled: true
      method: "random"
      n_iter: 20
      cv_folds: 5
      scoring: "accuracy"
      param_grid:
        n_estimators: [100, 200, 300, 500]
        learning_rate: [0.01, 0.05, 0.1]
        max_depth: [4, 6, 8]
        num_leaves: [15, 23, 31]
        min_child_samples: [20, 30, 50]
        subsample: [0.7, 0.8, 0.9]
        colsample_bytree: [0.6, 0.8, 1.0]
        reg_alpha: [0, 0.1, 0.5]
        reg_lambda: [0.5, 1.0, 2.0]

  neural_network:
    hidden_layer_sizes: [64, 32]
    activation: "relu"
    solver: "adam"
    alpha: 0.001
    learning_rate_init: 0.001
    batch_size: 256
    max_iter: 300
    early_stopping: true
    validation_fraction: 0.1
    n_iter_no_change: 15
    hyperparameter_tuning:
      enabled: true
      method: "random"
      n_iter: 20
      cv_folds: 5
      scoring: "accuracy"
      param_grid:
        hidden_layer_sizes: [[32], [64], [64, 32], [128, 64], [128, 64, 32]]
        alpha: [0.0001, 0.001, 0.01, 0.1]
        learning_rate_init: [0.0001, 0.0005, 0.001, 0.005]
        batch_size: [128, 256, 512]

evaluation:
  save_visualizations: true
  output_dir: "outputs"

paths:
  model_registry: "models"
  save_local_models: false

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  register_model: true
