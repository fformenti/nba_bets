# Shared training defaults.
# Experiment configs include this via _include and override what differs.

data:
  path: "data/processed/regular_season/games_features.csv"
  target_column: "win_bool"
  date_column: "gameDate"
  drop_na: true

filters:
  min_season: "1980/81"
  minimum_games_train: 15
  minimum_games_test: 15

weighting:
  enabled: true
  saturation_K: 30
  season_decay_enabled: true
  season_decay_lambda: 0.1

splitting:
  method: "temporal"
  test_size: 0.2
  val_size: 0.2
  random_state: 42

feature_engineering:
  selection_mode: "inclusion"
  # Columns used by prepare_data() for metadata extraction (weighting, analysis).
  # In inclusion mode these do not affect feature selection — only declared features are kept.
  metadata_columns:
    - "gameId"
    - "winner"
    - "hometeamPrename"
    - "hometeamId"
    - "hometeamName"
    - "homeScore"
    - "awayteamName"
    - "awayteamPrename"
    - "awayteamId"
    - "awayScore"
    - "hometeamLocation"
    - "awayteamLocation"
    - "gameLocation"
    - "hometeamConference"
    - "awayteamConference"
    - "winnerteamConference"
    - "gameType"
    - "gameDateOnlyStr"
    - "season"
    - "overtimes"
    - "postponed"
    - "is_neutral_court_game"
    - "games_played_HT"
    - "games_played_VT"

  features:
    record:
      lags: [1, 3, 5, 8, 13, 21, 34, 55, 82]
      location_lags: [5, 10, 20, 41]
      delta: true
      enabled: true
    point_differential:
      lags: [1, 3, 5, 8, 13, 21, 34, 55, 82]
      location_lags: [5, 10, 20, 41]
      delta: true
      enabled: false
    norm_point_differential:
      lags: [1, 3, 5, 8, 13, 21, 34, 55, 82]
      location_lags: [5, 10, 20, 41]
      delta: true
      enabled: true

    # Delta for every group lives here so create_delta_features and
    # resolve_feature_columns stay consistent when experiments enable a group.
    sos:
      delta: false
      enabled: false
    sos_adj_record:
      lags: [1, 3, 5, 8, 13, 21, 34, 55, 82]
      location_lags: [5, 10, 20, 41]
      delta: true
      enabled: true    # opt-in per experiment; declare lags explicitly when enabling
    gds:
      lags: [3, 5, 8, 13, 21, 34, 55, 82]
      location_lags: [5, 10, 20, 41]
      delta: true
      enabled: true 
    distance:
      lags: [1, 3, 7, 14]
      delta: true
      enabled: true
    rested_days:
      delta: true
      enabled: true
    streak:
      delta: true
      enabled: false
    last_season_record:
      delta: true
      enabled: true
    home_and_road:
      delta: false
      enabled: true
    indifference_flag:
      delta: true
      enabled: true
    neutral_court:
      delta: false
      enabled: false



feature_selection:
  enabled: true
  method: "boruta_shap"
  n_iterations: 20
  significance_level: 0.05
  include_tentative: true
  random_state: 42

preprocessing:
  scaling_method: "standard"
  imputation_strategy: "mean"
  handle_outliers: false

model:
  type: "classification"
  name: "nba_games_classifier"
  train_models:
    - random_forest
    - gradient_boosting
    - xgboost
    # - lgbm

  random_forest:
    n_estimators: 300
    max_depth: 10
    min_samples_split: 20
    min_samples_leaf: 15
    max_features: "sqrt"
    max_samples: 0.7
    class_weight: "balanced"
    hyperparameter_tuning:
      enabled: true
      method: "random"
      n_iter: 20
      cv_folds: 5
      scoring: "accuracy"
      param_grid:
        n_estimators: [100, 200, 300, 500]
        max_depth: [5, 7, 10]
        min_samples_split: [20, 30, 50]
        min_samples_leaf: [10, 15, 20, 30]
        max_features: ["sqrt", "log2", 0.5]
        max_samples: [0.6, 0.7, 0.8]

  gradient_boosting:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 5
    min_samples_split: 20
    min_samples_leaf: 10
    max_features: "sqrt"
    hyperparameter_tuning:
      enabled: true
      method: "random"
      n_iter: 20
      cv_folds: 5
      scoring: "accuracy"
      param_grid:
        n_estimators: [50, 100, 200, 300]
        learning_rate: [0.005, 0.01, 0.05]
        max_depth: [3, 4, 5, 6]
        min_samples_split: [10, 20, 30, 50]
        min_samples_leaf: [5, 10, 15, 20]
        subsample: [0.7, 0.8, 0.9]
        max_features: ["sqrt", "log2", 0.5]

  xgboost:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 5
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
    hyperparameter_tuning:
      enabled: true
      method: "random"
      n_iter: 20
      cv_folds: 5
      scoring: "accuracy"
      param_grid:
        n_estimators: [100, 200, 300, 500]
        learning_rate: [0.01, 0.05, 0.1]
        max_depth: [3, 4, 5, 6]
        subsample: [0.7, 0.8, 0.9]
        colsample_bytree: [0.6, 0.8, 1.0]
        reg_alpha: [0, 0.1, 0.5]
        reg_lambda: [0.5, 1.0, 2.0]

  lgbm:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 6
    num_leaves: 31
    min_child_samples: 20
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
    class_weight: "balanced"
    verbose: -1
    hyperparameter_tuning:
      enabled: true
      method: "random"
      n_iter: 20
      cv_folds: 5
      scoring: "accuracy"
      param_grid:
        n_estimators: [100, 200, 300, 500]
        learning_rate: [0.01, 0.05, 0.1]
        max_depth: [4, 6, 8]
        num_leaves: [15, 23, 31]
        min_child_samples: [20, 30, 50]
        subsample: [0.7, 0.8, 0.9]
        colsample_bytree: [0.6, 0.8, 1.0]
        reg_alpha: [0, 0.1, 0.5]
        reg_lambda: [0.5, 1.0, 2.0]

evaluation:
  save_visualizations: true
  output_dir: "outputs"

paths:
  model_registry: "models"
  save_local_models: false

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  register_model: true
