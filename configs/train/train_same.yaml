# Training config for same-conference games
# Trains a model on games where both teams are in the same conference

_include:
  - "../features.yaml"
  - "_defaults.yaml"

description: "Same-conference: sos-adjusted record, all lags, 1980/81 season"
tags:
  variation: "same_conference"

filters:
  min_season: "1980/81"
  conference_filter: "same"
  minimum_games_train: 5

feature_engineering:
  features:
    record:
      enabled: false
      lags: []
      location_lags: []
      delta: false

    gds:
      lags: [3, 5, 8, 13, 21, 34, 55, 82]
      location_lags: [5, 10, 20, 41]
      enabled: true

    sos_adj_record:
      enabled: true
      lags: [1, 3, 5, 8, 13, 21, 34, 55, 82]
      location_lags: [5, 10, 20, 41]
      delta: false

    home_and_road:
      delta: false
      enabled: true
    
feature_selection:
  include_tentative: true

paths:
  outputs: "outputs/same"

mlflow:
  experiment_name: "nba_bets_same_conference"
