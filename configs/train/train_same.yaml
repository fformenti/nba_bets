# Training config for same-conference games
# Trains a model on games where both teams are in the same conference

_include:
  - "../features.yaml"
  - "_defaults.yaml"

description: "Same-conference: sos-adjusted record, all lags, 1980/81 season"
tags:
  variation: "same_conference"

filters:
  min_season: "1980/81"
  conference_filter: "same"

feature_engineering:
  features:
    record:
      enabled: true
      lags: []
      location_lags: [10, 41]
      delta: true

    sos_adj_record:
      enabled: true
      lags: [1, 3, 5, 8, 13, 21, 34, 55, 82]
      delta: true
    
feature_selection:
  include_tentative: false

paths:
  outputs: "outputs/same"

mlflow:
  experiment_name: "nba_bets_same_conference"
