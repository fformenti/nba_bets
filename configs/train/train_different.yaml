# Training config for cross-conference games
# Trains a model on games where teams are from different conferences

_include:
  - "../features.yaml"
  - "_defaults.yaml"

description: "Cross-conference: all lags, RF default params"
tags:
  variation: "cross_conference"

filters:
  conference_filter: "different"

paths:
  outputs: "outputs/different"

mlflow:
  experiment_name: "nba_bets_cross_conference"
