# Example configuration file for classification training
# Copy this file and modify as needed for your experiments

data:
  path: "data/processed/regular_season/features/games_features.csv"
  target_column: "win_bool"
  date_column: "gameDate"
  drop_na: true

filters:
  start_date: "1980-08-01"
  minimum_games: 34

splitting:
  method: "temporal"  # 'random', 'temporal', or 'stratified'
  test_size: 0.2
  val_size: 0.2
  random_state: 42

feature_engineering:
  lags: [1,3,5,8,13,21,34,55,82]
  location_lags: [41]

  # Columns to exclude from features
  metadata_columns:
    - "gameId"
    - "winner"
    - "hometeamCity"
    - "hometeamId"
    - "hometeamName"
    - "homeScore"
    - "awayteamName"
    - "awayteamCity"
    - "awayteamId"
    - "awayScore"
    # - "hometeamConference"
    # - "awayteamConference"
    - "winnerteamConference"
    - "gameType"
    - "gameDateOnlyStr"
    - "season"

  originally_enriched_columns:
    - "win_bool"
    - "pts_diff"
    - "total_wins_HT"
    - "total_losses_HT"
    - "total_wins_VT"
    - "total_losses_VT"
    - "total_wins_HT_at_home"
    - "total_losses_HT_at_home"
    - "total_wins_VT_on_road"
    - "total_losses_VT_on_road"
    - "games_played_HT_at_home"
    - "games_played_VT_on_road"
    - "games_played_HT"
    - "games_played_VT"
    - "east_record_at_east"
    - "west_record_at_west"
    - "games_played_at_east"
    - "games_played_at_west"
    - "conference_diff_east_pct"
    - "games_played_east_vs_west"

preprocessing:
  scaling_method: "standard"  # 'standard', 'robust', or 'minmax'
  imputation_strategy: "mean"
  handle_outliers: false

model:
  type: "classification"
  name: "random_forest"
  hyperparameter_tuning:
    enabled: false
    method: "random"  # 'grid' or 'random'
    n_iter: 20
    cv_folds: 3
    scoring: "accuracy"

  # Model-specific parameters
  random_forest:
    n_estimators: 300
    max_depth: 15
    min_samples_split: 20
    min_samples_leaf: 10
    max_features: "sqrt"
    class_weight: "balanced"

  gradient_boosting:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 15
    min_samples_split: 20
    min_samples_leaf: 10

evaluation:
  save_visualizations: true
  output_dir: "outputs"

paths:
  model_registry: "models"
  outputs: "outputs"
  save_local_models: false
