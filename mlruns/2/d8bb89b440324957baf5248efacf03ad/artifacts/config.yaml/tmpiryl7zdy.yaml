data:
  date_column: gameDate
  drop_na: true
  path: data/processed/games_features.csv
  target_column: win_bool
evaluation:
  output_dir: outputs
  save_visualizations: true
feature_engineering:
  exclude_columns: []
  lags:
  - 1
  - 3
  - 5
  - 8
  - 13
  - 21
  - 34
  - 55
  - 82
  location_lags:
  - 41
  metadata_columns:
  - gameId
  - winner
  - hometeamCity
  - hometeamId
  - hometeamName
  - homeScore
  - awayteamName
  - awayteamCity
  - awayteamId
  - awayScore
  - hometeamConference
  - awayteamConference
  - winnerteamConference
  - gameType
  - gameDateOnlyStr
  - season
  originally_enriched_columns:
  - win_bool
  - pts_diff
  - total_wins_HT
  - total_losses_HT
  - total_wins_VT
  - total_losses_VT
  - total_wins_HT_at_home
  - total_losses_HT_at_home
  - total_wins_VT_on_road
  - total_losses_VT_on_road
  - games_played_HT_at_home
  - games_played_VT_on_road
  - games_played_HT
  - games_played_VT
  - east_record_at_east
  - west_record_at_west
  - games_played_at_east
  - games_played_at_west
  - conference_diff_east_pct
  - games_played_east_vs_west
filters:
  minimum_games: 34
  start_date: '1980-08-01'
model:
  gradient_boosting:
    learning_rate: 0.05
    max_depth: 15
    min_samples_leaf: 10
    min_samples_split: 20
    n_estimators: 300
  hyperparameter_tuning:
    cv_folds: 3
    enabled: false
    method: random
    n_iter: 20
    scoring: accuracy
  name: random_forest
  random_forest:
    class_weight: balanced
    max_depth: 15
    max_features: sqrt
    min_samples_leaf: 10
    min_samples_split: 20
    n_estimators: 300
  type: classification
paths:
  model_registry: models
  outputs: outputs
preprocessing:
  handle_outliers: false
  imputation_strategy: mean
  scaling_method: standard
splitting:
  method: temporal
  random_state: 42
  test_size: 0.2
  val_size: 0.2
